name: Diff perf nightly

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diff-perf:
    name: Diff perf (10k, exp-diff)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@1.120.0
      - uses: Swatinem/rust-cache@v2
      - name: Install with exp-diff
        env:
          MATURIN_PEP517_ARGS: "--features exp-diff"
        run: pip install -e ".[dev]"
      - name: Assert exp-diff extension present
        run: |
          python -c "import agri_core._native as n; assert hasattr(n, 'diff_pack_paths')"
          python -c "import agri_core._native as n; assert hasattr(n, 'diff_loaded')"
      - name: Run diff perf tests
        env:
          AGRI_BENCH_DIR: ${{ runner.temp }}/agri-bench
        run: pytest tests/perf/test_diff_native_perf.py -m perf --no-cov -q -p no:nbmake -W ignore::DeprecationWarning
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: diff-benchmark-${{ github.run_id }}
          path: ${{ runner.temp }}/agri-bench/bench-*.json
          if-no-files-found: warn
          retention-days: 30
