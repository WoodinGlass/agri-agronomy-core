name: Canary — agri-knowledge

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canary-knowledge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-strict:
    name: agri-core validate --strict on agri-knowledge main
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install engine
        run: pip install -e ".[dev]"
      - name: Checkout agri-knowledge main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          repository: WoodinGlass/agri-knowledge
          ref: main
          path: agri-knowledge
      - name: agri-core validate --strict
        run: agri-core validate --pack agri-knowledge --strict
      - name: agri-core lint-sources
        run: agri-core lint-sources --pack agri-knowledge
