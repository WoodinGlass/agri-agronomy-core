schema_version: 1
# Modules that read parameters. Every core parameter must name at least one
# module in used_by, and that module must list the parameter in reads.
# Test enforces the bidirectional relation.
modules:
  climate:
    description: "VPD, GDD, DLI, ET0."
    reads: [gdd_base, gdd_upper]
  thresholds:
    description: "Threshold checks."
    reads:
      - soil_ph
      - soil_ec
      - air_temp_day
      - air_temp_night
      - air_rh
      - vpd
      - dli
      - moisture_band
  stages:
    description: "Stage resolver."
    reads:
      - managed_cycle
      - phase_duration
      - phase_thermal_time
      - gdd_base
      - gdd_upper
  irrigation:
    description: "Irrigation modes."
    reads:
      - kc
      - kc_stage_length
      - root_depth
      - depletion_fraction
      - awd_reflood_depth
      - ponding_depth
      - percolation_rate
      - predrain_days
      - must_flood_phases
      - moisture_band
  fertilizer:
    description: "Nutrient to product, dose caps."
    reads:
      - managed_cycle
      - n_fertilizer_rate
      - p2o5_fertilizer_rate
      - k2o_fertilizer_rate
      - plant_density
      - n_max_per_application
      - p2o5_max_per_application
      - k2o_max_per_application
  media:
    description: "Growing media and water quality."
    reads:
      - water_ec_max
      - water_temp_max
  suitability:
    description: "Site suitability."
    reads:
      - suitability_weight_soil_ph
      - suitability_weight_soil_ec
      - suitability_weight_air_temp_day
      - suitability_weight_air_temp_night
      - suitability_weight_air_rh
      - suitability_weight_vpd
      - suitability_weight_dli
      - suitability_threshold_marginal
      - suitability_threshold_suitable
  propagation:
    description: "Propagation planner."
    reads:
      - propagation_method
      - propagation_duration_days
      - propagation_start_months
  safety:
    description: "Dose caps and label referral."
    reads:
      - n_max_per_application
      - p2o5_max_per_application
      - k2o_max_per_application
  export:
    description: "Exports and schemas."
    reads: []
