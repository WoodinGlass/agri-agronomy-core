dictionary_version: 1.0.0-dev

parameters:
  # --- cycle (5) ---
  managed_cycle:
    stage: cycle
    shape: enum
    enum_values: [single_season, multi_season]
    unit: null
    physical_range: null
    phase_set: none
    scope_keys: []
    applies_to:
      organism_groups: [vascular_plant, fungus]
    used_by: [stages, fertilizer]
    tier_required: true
    safety_class: none
    rationale: null
    kind: core
    description: "Whether cultivation is a single season or spans multiple seasons."
    introduced_in: "1.0.0"
  phase_duration:
    stage: cycle
    shape: scalar
    unit: day
    physical_range: [1.0, 3650.0]
    phase_set: biological
    scope_keys: []
    applies_to:
      organism_groups: [vascular_plant, fungus]
    used_by: [stages]
    tier_required: true
    safety_class: none
    rationale: null
    kind: core
    description: "Number of days in a given biological phase."
    introduced_in: "1.0.0"
  phase_thermal_time:
    stage: cycle
    shape: scalar
    unit: degree_day
    physical_range: [0.0, 10000.0]
    phase_set: biological
    scope_keys: []
    applies_to:
      organism_groups: [vascular_plant]
    used_by: [stages]
    tier_required: false
    safety_class: none
    rationale: null
    kind: core
    description: "Accumulated thermal time in a given biological phase."
    introduced_in: "1.0.0"
  gdd_base:
    stage: cycle
    shape: scalar
    unit: degree_Celsius
    physical_range: [0.0, 30.0]
    phase_set: none
    scope_keys: []
    applies_to:
      organism_groups: [vascular_plant]
    used_by: [climate, stages]
    tier_required: false
    safety_class: none
    rationale: null
    kind: core
    description: "Base temperature for growing degree-day accumulation."
    introduced_in: "1.0.0"
  gdd_upper:
    stage: cycle
    shape: scalar
    unit: degree_Celsius
    physical_range: [0.0, 50.0]
    phase_set: none
    scope_keys: []
    applies_to:
      organism_groups: [vascular_plant]
    used_by: [climate, stages]
    tier_required: false
    safety_class: none
    rationale: null
    kind: core
    description: "Optional upper cut-off for growing degree-day accumulation."
    introduced_in: "1.0.0"

  # --- thresholds (7) ---
  soil_ph:
    stage: site_media
    shape: trapezoid
    unit: pH
    physical_range: [0.0, 14.0]
    phase_set: none
    scope_keys: [country, region, elevation_m, system, climate_zone, variety]
    applies_to:
      organism_groups: [vascular_plant, fungus]
      systems: [field, flooded, container]
    used_by: [thresholds]
    tier_required: false
    safety_class: none
    rationale: null
    kind: core
    description: "Soil or growing-medium pH optimal and absolute bounds."
    introduced_in: "1.0.0"
  soil_ec:
    stage: site_media
    shape: trapezoid
    unit: decisiemens/meter
    physical_range: [0.0, 50.0]
    phase_set: none
    scope_keys: [country, region, elevation_m, system, climate_zone, variety]
    applies_to:
      organism_groups: [vascular_plant, fungus]
      systems: [field, flooded, container]
    used_by: [thresholds]
    tier_required: false
    safety_class: none
    rationale: null
    kind: core
    description: "Soil or medium electrical conductivity optimal and absolute bounds."
    introduced_in: "1.0.0"
  air_temp_day:
    stage: care
    shape: trapezoid
    unit: degree_Celsius
    physical_range: [-40.0, 60.0]
    phase_set: biological
    scope_keys: [country, region, elevation_m, climate_zone, variety]
    applies_to:
      organism_groups: [vascular_plant, fungus]
    used_by: [thresholds]
    tier_required: true
    safety_class: none
    rationale: null
    kind: core
    description: "Daytime air temperature optimal and absolute bounds."
    introduced_in: "1.0.0"
  air_temp_night:
    stage: care
    shape: trapezoid
    unit: degree_Celsius
    physical_range: [-40.0, 60.0]
    phase_set: biological
    scope_keys: [country, region, elevation_m, climate_zone, variety]
    applies_to:
      organism_groups: [vascular_plant, fungus]
    used_by: [thresholds]
    tier_required: true
    safety_class: none
    rationale: null
    kind: core
    description: "Night-time air temperature optimal and absolute bounds."
    introduced_in: "1.0.0"
  air_rh:
    stage: care
    shape: trapezoid
    unit: percent
    physical_range: [0.0, 100.0]
    phase_set: biological
    scope_keys: [country, region, elevation_m, climate_zone, variety]
    applies_to:
      organism_groups: [vascular_plant, fungus]
    used_by: [thresholds]
    tier_required: true
    safety_class: none
    rationale: null
    kind: core
    description: "Relative humidity optimal and absolute bounds."
    introduced_in: "1.0.0"
  vpd:
    stage: care
    shape: trapezoid
    unit: kilopascal
    physical_range: [0.0, 10.0]
    phase_set: biological
    scope_keys: [country, region, elevation_m, climate_zone, variety]
    applies_to:
      organism_groups: [vascular_plant]
    used_by: [thresholds]
    tier_required: false
    safety_class: none
    rationale: null
    kind: core
    description: "Vapor pressure deficit optimal and absolute bounds."
    introduced_in: "1.0.0"
  dli:
    stage: care
    shape: trapezoid
    unit: mole/meter**2/day
    physical_range: [0.0, 100.0]
    phase_set: biological
    scope_keys: [country, region, elevation_m, climate_zone, environment, variety]
    applies_to:
      organism_groups: [vascular_plant]
    used_by: [thresholds]
    tier_required: false
    safety_class: none
    rationale: null
    kind: core
    description: "Daily light integral optimal and absolute bounds."
    introduced_in: "1.0.0"


  # --- c-2b: irrigation + media/air ---
  kc:
    stage: care
    shape: scalar
    unit: dimensionless
    physical_range: [0.0, 2.0]
    phase_set: kc
    allowed_phases: [initial, midseason, late_season]
    scope_keys: [country, region, elevation_m, system, climate_zone, variety]
    applies_to:
      organism_groups: [vascular_plant]
      systems: [field]
    used_by: [irrigation]
    tier_required: false
    safety_class: none
    rationale: null
    kind: core
    description: "Crop coefficient for evapotranspiration."
    introduced_in: "1.0.0"
  kc_stage_length:
    stage: care
    shape: scalar
    unit: day
    physical_range: [1.0, 3650.0]
    phase_set: kc
    allowed_phases: [initial, development, midseason, late_season]
    scope_keys: [country, region, elevation_m, system, climate_zone, variety]
    applies_to:
      organism_groups: [vascular_plant]
      systems: [field]
    used_by: [irrigation]
    tier_required: false
    safety_class: none
    rationale: null
    kind: core
    description: "Length in days of a crop-coefficient stage."
    introduced_in: "1.0.0"
  root_depth:
    stage: care
    shape: scalar
    unit: meter
    physical_range: [0.05, 10.0]
    phase_set: kc
    scope_keys: [country, region, variety]
    applies_to:
      organism_groups: [vascular_plant]
      systems: [field]
    used_by: [irrigation]
    tier_required: false
    safety_class: none
    rationale: null
    kind: core
    description: "Depth of the effective root zone."
    introduced_in: "1.0.0"
  depletion_fraction:
    stage: care
    shape: scalar
    unit: dimensionless
    physical_range: [0.0, 1.0]
    phase_set: none
    scope_keys: [country, region, variety]
    applies_to:
      organism_groups: [vascular_plant]
      systems: [field]
    used_by: [irrigation]
    tier_required: false
    safety_class: none
    rationale: null
    kind: core
    description: "Fraction of plant-available water that can be depleted before irrigation."
    introduced_in: "1.0.0"
  awd_reflood_depth:
    stage: care
    shape: scalar
    unit: centimeter
    physical_range: [0.0, 50.0]
    phase_set: none
    scope_keys: [country, region, variety]
    applies_to:
      organism_groups: [vascular_plant]
      systems: [flooded]
    used_by: [irrigation]
    tier_required: false
    safety_class: none
    rationale: null
    kind: core
    description: "Water-table depth below the soil surface at which an AWD field is re-flooded; positive values indicate depth below surface."
    introduced_in: "1.0.0"
  ponding_depth:
    stage: care
    shape: scalar
    unit: centimeter
    physical_range: [0.0, 30.0]
    phase_set: biological
    scope_keys: [country, region, variety]
    applies_to:
      organism_groups: [vascular_plant]
      systems: [flooded]
    used_by: [irrigation]
    tier_required: false
    safety_class: none
    rationale: null
    kind: core
    description: "Standing water depth above the soil surface during a flooded phase."
    introduced_in: "1.0.0"
  percolation_rate:
    stage: care
    shape: scalar
    unit: millimeter/day
    physical_range: [0.0, 100.0]
    phase_set: none
    scope_keys: [country, region]
    applies_to:
      organism_groups: [vascular_plant]
      systems: [flooded]
    used_by: [irrigation]
    tier_required: false
    safety_class: none
    rationale: null
    kind: core
    description: "Downward water loss through the soil profile."
    introduced_in: "1.0.0"
  predrain_days:
    stage: care
    shape: scalar
    unit: day
    physical_range: [0.0, 30.0]
    phase_set: none
    scope_keys: [country, region]
    applies_to:
      organism_groups: [vascular_plant]
      systems: [flooded]
    used_by: [irrigation]
    tier_required: false
    safety_class: none
    rationale: null
    kind: core
    description: "Number of days before harvest at which a flooded field is drained."
    introduced_in: "1.0.0"
  must_flood_phases:
    stage: care
    shape: enum_set
    enum_source: "phases:biological"
    unit: null
    physical_range: null
    phase_set: none
    scope_keys: [country, region, variety]
    applies_to:
      organism_groups: [vascular_plant]
      systems: [flooded]
    used_by: [irrigation]
    tier_required: false
    safety_class: none
    rationale: null
    kind: core
    description: "Set of biological phases during which the field must remain flooded."
    introduced_in: "1.0.0"
  moisture_band:
    stage: care
    shape: trapezoid
    unit: percent
    physical_range: [0.0, 100.0]
    phase_set: none
    scope_keys: [country, region, variety]
    applies_to:
      organism_groups: [vascular_plant]
      systems: [container]
    used_by: [irrigation, thresholds]
    tier_required: false
    safety_class: none
    rationale: null
    kind: core
    description: "Relative plant-available water target for container irrigation."
    introduced_in: "1.0.0"
  water_ec_max:
    stage: site_media
    shape: scalar
    unit: decisiemens/meter
    physical_range: [0.0, 10.0]
    phase_set: none
    scope_keys: [country, region, system]
    applies_to:
      organism_groups: [vascular_plant, fungus]
    used_by: [media]
    tier_required: false
    safety_class: none
    rationale: null
    kind: core
    description: "Maximum electrical conductivity of irrigation water."
    introduced_in: "1.0.0"
  water_temp_max:
    stage: site_media
    shape: scalar
    unit: degree_Celsius
    physical_range: [0.0, 50.0]
    phase_set: none
    scope_keys: [country, region, system]
    applies_to:
      organism_groups: [vascular_plant, fungus]
    used_by: [media]
    tier_required: false
    safety_class: none
    rationale: null
    kind: core
    description: "Maximum irrigation-water temperature."
    introduced_in: "1.0.0"


  # --- c-3a: fertilizer ---
  n_fertilizer_rate:
    stage: care
    shape: range
    unit: kilogram/hectare
    physical_range: [0.0, 2000.0]
    phase_set: none
    scope_keys: [country, region, system, use, variety, yield_target]
    applies_to:
      organism_groups: [vascular_plant]
      systems: [field, flooded]
    used_by: [fertilizer]
    tier_required: false
    safety_class: none
    rationale: null
    kind: core
    description: "Recommended nutrient rate to apply as fertilizer (as N, not crop uptake) for one crop period. The period is one cycle when managed_cycle is single_season, one calendar year when multi_season."
    introduced_in: "1.0.0"
  p2o5_fertilizer_rate:
    stage: care
    shape: range
    unit: kilogram/hectare
    physical_range: [0.0, 2000.0]
    phase_set: none
    scope_keys: [country, region, system, use, variety, yield_target]
    applies_to:
      organism_groups: [vascular_plant]
      systems: [field, flooded]
    used_by: [fertilizer]
    tier_required: false
    safety_class: none
    rationale: null
    kind: core
    description: "Recommended nutrient rate to apply as fertilizer (as P2O5, not crop uptake) for one crop period. The period is one cycle when managed_cycle is single_season, one calendar year when multi_season."
    introduced_in: "1.0.0"
  k2o_fertilizer_rate:
    stage: care
    shape: range
    unit: kilogram/hectare
    physical_range: [0.0, 2000.0]
    phase_set: none
    scope_keys: [country, region, system, use, variety, yield_target]
    applies_to:
      organism_groups: [vascular_plant]
      systems: [field, flooded]
    used_by: [fertilizer]
    tier_required: false
    safety_class: none
    rationale: null
    kind: core
    description: "Recommended nutrient rate to apply as fertilizer (as K2O, not crop uptake) for one crop period. The period is one cycle when managed_cycle is single_season, one calendar year when multi_season."
    introduced_in: "1.0.0"
  plant_density:
    stage: planting
    shape: scalar
    unit: 1/hectare
    physical_range: [0.0, 100000000.0]
    phase_set: none
    scope_keys: [country, region, system, environment, use, variety, growth_habit, establishment]
    applies_to:
      organism_groups: [vascular_plant]
      systems: [field, flooded]
    used_by: [fertilizer]
    tier_required: false
    safety_class: none
    rationale: null
    kind: core
    description: "Planting density as counting stations per hectare. The counting unit matches the per-plant dose basis: individual plant, hill, banana stool, or tree. Profile values record the typical density; the calculator (M3) accepts the actual density from the caller and uses the profile value only as a recorded assumption, never silently."
    introduced_in: "1.0.0"
  n_max_per_application:
    stage: care
    shape: scalar
    unit: kilogram/hectare
    physical_range: [0.0, 500.0]
    phase_set: none
    scope_keys: [country, region, system]
    applies_to:
      organism_groups: [vascular_plant]
      systems: [field, flooded]
    used_by: [fertilizer, safety]
    tier_required: false
    safety_class: dose_cap
    rationale: "Over-application of nitrogen leaches nitrate into groundwater, which is regulated in many jurisdictions, and can injure seedlings."
    kind: core
    description: "Maximum nitrogen per single fertilizer application, as kg N per hectare."
    introduced_in: "1.0.0"
  p2o5_max_per_application:
    stage: care
    shape: scalar
    unit: kilogram/hectare
    physical_range: [0.0, 500.0]
    phase_set: none
    scope_keys: [country, region, system]
    applies_to:
      organism_groups: [vascular_plant]
      systems: [field, flooded]
    used_by: [fertilizer, safety]
    tier_required: false
    safety_class: dose_cap
    rationale: "Over-application of phosphorus runs off into surface water and causes eutrophication."
    kind: core
    description: "Maximum P2O5 per single fertilizer application, as kg P2O5 per hectare."
    introduced_in: "1.0.0"
  k2o_max_per_application:
    stage: care
    shape: scalar
    unit: kilogram/hectare
    physical_range: [0.0, 500.0]
    phase_set: none
    scope_keys: [country, region, system]
    applies_to:
      organism_groups: [vascular_plant]
      systems: [field, flooded]
    used_by: [fertilizer, safety]
    tier_required: false
    safety_class: dose_cap
    rationale: "Over-application of potassium can cause root salt injury and can contribute to magnesium deficiency in grazing livestock."
    kind: core
    description: "Maximum K2O per single fertilizer application, as kg K2O per hectare."
    introduced_in: "1.0.0"
