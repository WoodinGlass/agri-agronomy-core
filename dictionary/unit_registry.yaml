schema_version: 1
# Custom units not represented by pint. Standard units use their pint ID
# directly in parameter definitions and do not need an entry here.
custom_units:
  pH:
    kind: custom
    description: "Negative log10 of hydrogen ion activity."
    range: [0.0, 14.0]
  ppm:
    kind: custom
    description: "Milligrams per liter (mg/L). Water TDS only; not soil."
    range: [0.0, 10000.0]
  percent:
    kind: custom
    description: "Percentage, 0-100."
    range: [0.0, 100.0]
  degree_day:
    kind: custom
    description: "Accumulated thermal time above a base temperature: delta_degree_Celsius * day."
    range: [0.0, 100000.0]
# Aliases registered on the pint UnitRegistry before parsing canonical units.
# `plant` is a count-like denominator: `g/plant` means grams per individual
# plant. Dimensional analysis cannot distinguish `g/plant` from `g/count`.
pint_aliases:
  plant: count
