default_install_hook_types: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-toml
      - id: check-case-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout

  # Requires: pip install -e ".[dev]" in the active environment.
  - repo: local
    hooks:
      - id: agri-core-validate
        name: agri-core validate
        entry: agri-core validate --pack src/agri_core/_samples/sample_pack
        language: system
        files: '^(src/agri_core/_samples|schema)/.*\.(csv|ya?ml|json|toml)$'
        pass_filenames: false
        verbose: true
      - id: gen-dictionary-doc
        name: dictionary doc up to date
        entry: python3 scripts/gen_dictionary_doc.py --check
        language: system
        files: '^(dictionary/parameters\.core\.yaml|docs/DICTIONARY\.md)$'
        pass_filenames: false
        verbose: true
