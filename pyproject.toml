[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "agri-agronomy-core"
version = "0.0.0"
description = "Offline, deterministic crop profiles and agronomy calculators."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0 AND CC-BY-4.0"
license-files = ["LICENSE", "LICENSE-DATA"]
authors = [{ name = "WoodinGlass and the agri-agronomy-core contributors" }]
keywords = ["agronomy", "crop-profiles", "offline", "deterministic", "agriculture"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.5,<3",
    "jsonschema>=4.20,<5",
    "pyyaml>=6.0,<7",
    "pint>=0.23,<0.25",
    "typer>=0.12,<0.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "hypothesis>=6.100,<7",
    "ruff>=0.6,<0.15",
    "mypy>=1.10,<2",
    "nbmake>=1.5,<2",
    "nbstripout>=0.7,<1",
    "pre-commit>=3.7,<5",
    "pip-audit>=2.7,<3",
    "build>=1.2,<2",
    "twine>=5,<7",
]

[project.urls]
Homepage = "https://github.com/WoodinGlass/agri-agronomy-core"
Repository = "https://github.com/WoodinGlass/agri-agronomy-core"
Issues = "https://github.com/WoodinGlass/agri-agronomy-core/issues"
Changelog = "https://github.com/WoodinGlass/agri-agronomy-core/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/agri_core"]

[tool.hatch.build.targets.sdist]
include = [
    "src/agri_core",
    "tests",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "LICENSE-DATA",
    "pyproject.toml",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PT"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
show_error_codes = true
files = ["src", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["pint.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config --cov=agri_core --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
filterwarnings = ["error"]
xfail_strict = true
markers = [
    "unit: fast, no external dependencies",
    "property: Hypothesis-driven invariants",
    "contract: public API stability",
    "scenario: end-to-end expected behaviour",
    "golden: validated against published worked examples",
]

[tool.coverage.run]
branch = true
source = ["agri_core"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
