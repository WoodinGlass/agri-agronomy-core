[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "agri-agronomy-core"
version = "0.0.0"
description = "Offline, deterministic crop profiles and agronomy calculators."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "WoodinGlass and the agri-agronomy-core contributors" }]
keywords = ["agronomy", "crop-profiles", "offline", "deterministic", "agriculture"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.13,<3",
    "jsonschema>=4.20,<5",
    "pyyaml>=6.0.2,<7",
    "pint>=0.24.4,<0.26",
    "typer>=0.18,<0.20",
    "packaging>=24,<27",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-cov>=6.1.1,<8",
    "hypothesis>=6.100,<7",
    "ruff>=0.14,<0.18",
    "mypy>=1.20,<3",
    "nbmake>=1.5,<2",
    "nbstripout>=0.7,<1",
    "pre-commit>=3.7,<5",
    "pip-audit>=2.7,<3",
    "build>=1.2,<2",
    "twine>=7,<8",
    "pip-tools>=7.4,<8",
    "hatchling>=1.25,<2",
    "editables>=0.5,<1",
    "types-jsonschema>=4.20,<5",
    "types-PyYAML>=6.0,<7",
]

[project.urls]
Homepage = "https://github.com/WoodinGlass/agri-agronomy-core"
Repository = "https://github.com/WoodinGlass/agri-agronomy-core"
Issues = "https://github.com/WoodinGlass/agri-agronomy-core/issues"
Changelog = "https://github.com/WoodinGlass/agri-agronomy-core/blob/main/CHANGELOG.md"

[project.scripts]
agri-core = "agri_core.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agri_core"]

[tool.hatch.build.targets.wheel.force-include]
"schema" = "agri_core/_data/schema"
"dictionary" = "agri_core/_dictionary"

[tool.hatch.build.targets.sdist]
include = [
    "src/agri_core",
    "dictionary",
    "schema",
    "tests",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
    "Makefile",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PT"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
show_error_codes = true
# src/ only: mypy strict runs on production code. tests/ are type-checked
# indirectly through pytest + ruff. Includes tests/ when a Colab-safe solution
# for third-party stub parse errors (contourpy PEP 695, Python 3.12+) exists.
files = ["src"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["pint.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config --cov=agri_core --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
filterwarnings = [
    "error",
    # typer 0.18+ (as of 0.19.2) still imports names such as
    # click.utils.get_binary_stream that click 8.5 deprecates on access.
    # Narrowed to click.utils.* only: other DeprecationWarnings still fail
    # the suite. Remove when the typer line stops importing them.
    "ignore:.*click\\.utils\\..*is deprecated and will be removed in Click 9.*:DeprecationWarning",
]
xfail_strict = true
markers = [
    "unit: fast, no external dependencies",
    "property: Hypothesis-driven invariants",
    "contract: public API stability",
    "scenario: end-to-end expected behaviour",
    "golden: validated against published worked examples",
]

[tool.coverage.run]
branch = true
source = ["agri_core"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
