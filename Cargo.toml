[workspace]
resolver = "2"
members = ["crates/agri-kernel", "crates/agri-py"]

[workspace.package]
version = "0.1.5"
edition = "2021"
rust-version = "1.100"
license = "Apache-2.0"

[workspace.dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.11"
pyo3 = { version = "0.30", features = ["abi3-py311", "extension-module"] }

[profile.release]
lto = "thin"
codegen-units = 1
