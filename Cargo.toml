[workspace]
resolver = "2"
members = ["crates/agri-kernel", "crates/agri-py"]

[workspace.package]
version = "0.1.5"
edition = "2021"
rust-version = "1.100"
license = "Apache-2.0"

[workspace.dependencies]
serde = "1"
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.11"
toml = "0.8"
pyo3 = { version = "0.30", features = ["abi3-py311", "extension-module"] }
# M21 Phase C/D (A1b, stop-loss prep): SQLite build + CSV parse
rusqlite = { version = "0.42", features = ["bundled", "serialize"] }
csv = "1"
# M21 G4-2: Unicode normalization (pinned per ADR-019 §11.1)
unicode-normalization = "=0.1.26"
caseless = "=0.2.2"

[profile.release]
lto = "thin"
codegen-units = 1
