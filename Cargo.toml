[workspace]
resolver = "2"
members = ["crates/agri-kernel", "crates/agri-py"]

[workspace.package]
version = "0.1.5"
edition = "2021"
rust-version = "1.100"
license = "Apache-2.0"

[workspace.dependencies]
serde = "1"
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.11"
toml = "1.2"
pyo3 = { version = "0.30", features = ["abi3-py311", "extension-module"] }
# M21 Phase C/D (A1b, stop-loss prep): SQLite build + CSV parse
rusqlite = { version = "0.42", features = ["bundled", "serialize"] }
csv = "1"
# M21 G4-2: Unicode normalization (pinned per ADR-019 §11.1)
unicode-normalization = "=0.1.26"
caseless = "=0.2.2"
# M21 D3 (Phase G extension): ICU4X as third oracle, dev-only, nightly.
# icu_casemap/icu_normalizer license = Unicode-3.0 (deny.toml allowlist).
# Not shipped; only used by crates/agri-kernel dev-tests.
icu_casemap = "=2.4.0"
icu_normalizer = "=2.4.0"
# M21 D4 (Phase G extension): proptest for property-based testing.
proptest = "1"

[profile.release]
lto = "thin"
codegen-units = 1
